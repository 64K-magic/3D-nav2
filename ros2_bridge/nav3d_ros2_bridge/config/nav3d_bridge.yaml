nav3d_bridge_node:
  ros__parameters:
    frame_id: map

    # Default robot / plan start (building2_9 stair landing).
    start.x: 8.5
    start.y: -3.3
    start.z: 0.3

    trajectory.publish_max_poses: 600

    planning.mode: 3d
    planning.search_algorithm: astar
    planning.traversability: uav
    planning.use_octomap_map: false
    # UAV free-space clearance. Ignored in ground mode (uses ground_robot_radius).
    planning.inflation_radius: 0.0
    planning.ground_strict_direct_support: false
    planning.ground_snap_radius_cells: 6
    planning.ground_support_xy_radius_cells: 1
    planning.ground_support_depth_cells: 1
    # A* sphere clearance. Keep ≤0.25 on building2_9 — 0.30+ seals hallways
    # (start component ~2500 cells, never reaches west wing). Corner avoidance
    # uses soft keepout + wall_clearance, not a fatter sphere.
    planning.ground_robot_radius: 0.25
    planning.ground_footprint_enabled: true
    planning.ground_footprint_xy: [-0.67, -0.4, -0.67, 0.4, 0.67, 0.4, 0.67, -0.4]
    planning.ground_body_clearance: 0.5
    planning.ground_body_height: 0.35
    planning.ground_max_pitch_rad: 0.7
    planning.ground_terrain_ignore_margin: 0.55
    planning.ground_footprint_sample_step: 0.1
    # Stair corner: strict concave-L soft cost (loose L made a flat field so
    # keepout never preferred the outer arc). Hard ban only for explicit xyr.
    planning.ground_corner_keepout_radius: 1.5
    # Omit keepout_xyr when unused — ROS2 rejects empty [] array params.
    # planning.ground_corner_keepout_xyr: [9.0, -3.0, 1.0]
    planning.ground_corner_keepout_z_min: -1.0
    planning.ground_corner_keepout_z_max: 8.0
    planning.ground_corner_keepout_penalty: 80.0
    planning.ground_corner_keepout_hard_core_scale: 0.5
    planning.ground_wall_clearance: 0.6
    planning.ground_wall_clearance_weight: 30.0
    planning.ground_climb_penalty: 0.85
    # Soft prefer staying near start/goal z when they look same-floor. Hard z-band
    # caused no_path on building2_9 (stair landing ↔ west wing only join upstairs).
    planning.ground_leave_floor_penalty: 25.0
    # Optional multi-floor via waypoints (off by default; no map-specific coords).
    planning.ground_landing_via_enabled: false
    planning.ground_landing_via_min_dz: 0.7
    planning.ground_landing_via_radius: 0.8
    planning.uav_endpoint_snap_radius_cells: 12
    planning.enable_dynamic_feasibility_check: false
    planning.dynamic_feasibility_mode: sampled
    planning.max_velocity: 1000000000.0
    planning.max_acceleration: 1000000000.0
    planning.feasibility_sample_dt: 0.05
    planning.max_dynamic_time_scale: 10.0
    planning.enable_initial_time_allocation: false
    planning.min_time_allocation_interval: 0.05

    imu.topic: /imu
    imu.use_for_body_attitude: false

    map.pcd_path: ""
    map.pcd_loader: builtin
    map.resolution: 0.2
    map.min_points_per_voxel: 1
    map.min_cluster_voxels: 1
    map.insert_free_space_rays: false
    map.sensor_origin.x: 0.0
    map.sensor_origin.y: 0.0
    map.sensor_origin.z: 0.0
    map.occupancy_grid_max_cells: 1000000
    map.occupancy_grid_min_z: 0.2
    map.occupancy_grid_max_z: 0.9

    local_grid.enabled: true
    local_grid.resolution: 0.2
    local_grid.ray_clearing.enabled: true
    local_grid.retention_sec: 0.0
    local_grid.max_retained_frames: 1
    local_grid.max_observation_age_sec: 5.0
    local_grid.max_future_stamp_sec: 0.2

    safety.enabled: true
    # Ground mode ignores trajectory-ahead collisions in code (stair B-spline
    # chords clip risers); local replan still applies for UAV free-space mode.
    safety.emergency_stop_horizon: 0.5
    safety.lookahead_horizon: 0.8
    safety.replan_cooldown_sec: 0.15
    safety.local_replan_lookahead_distance: 6.0
    safety.local_replan_enabled: true
    safety.local_use_raw_astar: true
    safety.local_astar_max_iterations: 20000

    controller.enabled: true
    controller.control_dt: 0.1
    controller.lookahead_time: 0.4
    controller.max_speed: 1.0
    controller.goal_tolerance: 0.15
    controller.command_frame: map
    controller.motion_model: uav
    controller.max_linear_acceleration: 1.5
    controller.min_turning_radius: 1.0
    controller.yaw_gain: 2.0
    controller.max_yaw_rate: 0.75
    controller.max_yaw_acceleration: 1.5
    controller.command_path_sample_step: 0.05
    # Default is auto: false for ground (stairs), true for uav.
    # controller.block_occupied_voxels: true

nav3d_cmd_vel_pose_sim:
  ros__parameters:
    frame_id: map

    trajectory.publish_max_poses: 600
    start_x: 8.5
    start_y: -3.3
    start_z: 0.3
    start_yaw: 0.0
    update_rate: 20.0
    max_step: 0.2
    cmd_timeout: 1.0
    command_frame: map
